# ---------------------------------------------------------------------------
# Chronicle
# ---------------------------------------------------------------------------
# Switches for content added after Interlude.
# Read once at server start, a restart is required after changes.

# Instance zone scripts (Kamaloka, Pailaka, Freya, Seven Signs, etc.).
# Default: True
EnableInstances = False

# Gracia: Seeds, Keucereus Alliance Base, airships.
# Default: True
EnableGracia = False

# Hellbound island scripts.
# Default: True
EnableHellbound = False

# Territory War: automatic schedule, territory NPCs and registration.
# Castle territories stay loaded because castles depend on them.
# Default: True
EnableTerritoryWar = False

# Elemental attributes on weapons and armor (attribute stones).
# Default: True
EnableAttributes = False

# The experience bonus of recommendations and its window (the vote system of Gracia Final).
# Recommendations themselves stay: they are counted as in Interlude.
# Default: True
EnableRecommendationBonus = False

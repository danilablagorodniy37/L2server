# ---------------------------------------------------------------------------
# Phantom players (bots)
# ---------------------------------------------------------------------------
# Characters without a client that walk around the big towns and chat.
# They are real characters of the account below, created once and loaded on
# every start. Script: com/l2jserver/datapack/custom/phantoms/Phantoms.java
# Data: data/phantoms (gear.txt, zones.txt, phrases.txt)

# Default: False
Enabled = True

# Number of bots in the world.
Count = 443

# Account that owns the bot characters. Login to it is blocked.
Account = phantoms

# Towns the bots live in (map region names from data/mapregion).
Towns = giran_castle_town,aden_town,godard_town,rune_town,oren_castle_town,dion_castle_town,gludio_castle_town,heiness_town,town_of_schuttgart

# Level range of new bots.
MinLevel = 20
MaxLevel = 80

# Seconds after server start before the bots enter the world.
StartDelay = 30

# How far a bot walks from its town square, in game units.
WanderRadius = 1500

# Average seconds between two chat lines of one bot (random 50%-150%).
ChatInterval = 180

# Minimum seconds between two trade (+) or shout (!) lines in one region.
RegionChatInterval = 40

# Bots answer players who talk near them (greetings, questions, trade).
ReplyToPlayers = True

# Feeds a few made up events (a raid boss killed, a death, a level up, a siege)
# a moment after the start, to see the bots react without waiting for real ones.
# Default: False
DebugNews = False

# Lets the bots hear each other in the chat event, to test answers without a client.
# Default: False
DebugChat = False

# Share of the bots that go hunting instead of standing in town, in percent.
# Default: 0 (everyone stays in town)
HuntShare = 100

# How long one hunting trip lasts, in minutes.
# Default: 20
HuntMinutes = 20

# Bots that keep a private store instead of walking around, and the town they trade in.
# They are the first bots of the list, so they always stand in the same place.
# Default: 0
Traders = 40
TradeTown = giran_castle_town

# The bots think with a small language model running on this machine (Ollama: ollama run llama3.2).
# When it is off, busy or slow, they answer from data/phantoms/phrases.txt as before.
Llm = True
LlmUrl = http://127.0.0.1:11434/api/generate
LlmModel = llama3.2
# How long a bot waits for the model before it falls back to the phrase book, in milliseconds.
LlmTimeout = 4000
# How many bots may think at the same time, and how many words an answer may have.
LlmSlots = 3
LlmWords = 14

# Full parties of high level bots that hold one hunting ground together: a knight, a healer,
# buffers, archers and a duelist. They are created once and kept on the bot account.
Squads = 4
SquadSize = 9
SquadLevel = 78
SquadPlace = Ketra Orc Outpost
SquadX = 136958
SquadY = -89946
SquadZ = -3697

# Small groups of two to four of the wandering bots that hunt together in a zone of their level.
SmallParties = 20

# Bots that keep to the towns and never go hunting. The rest of them, after the traders,
# are out in the world killing monsters and raid bosses.
TownBots = 100

# How long a full party stays on a raid boss, and how long it rests between raids, in minutes.
RaidMinutes = 12
RaidEvery = 30

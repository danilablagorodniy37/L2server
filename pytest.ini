[pytest]
testpaths = tests
pythonpath = tools/interlude tools/client
addopts = -ra
markers =
	acis: needs the aCis datapack (../acis_public-master), skipped without it
	client: needs the client copy of this build (S:/Programming/L2client/HighFive), skipped without it
	db: needs MySQL with l2jdb_custom on port 3307, skipped without it
	server: starts login and game server (slow, opt-in with --run-server)
	crash: hits the running servers with broken traffic (opt-in with --run-crash)
